version: '3.8'

services:
  qwen3-tts:
    build: .
    ports:
      - "5123:5123"  # TTS server
      - "7860:7860"  # Gradio UI
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - ./voice_prompts:/root/Qwen3-TTS_UserFiles/voice_prompts
      - ./config.json:/root/Qwen3-TTS_UserFiles/config.json
    # Server binds 0.0.0.0 via --public in Dockerfile CMD
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  huggingface_cache:

[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -m "not e2e"
markers =
    ai_regression: AI regression tests (prevent systematic AI-introduced bugs)
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests

name: Audio Quality Evaluation

on:
  pull_request:
    paths:
      - 'qwen3_tts/core/engine/**'
      - 'qwen3_tts/server/**'
      - 'tests/evaluations/**'

permissions:
  contents: read

jobs:
  audio-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install evaluation deps
        run: |
          pip install numpy jiwer
          pip install openai-whisper || echo "Whisper install failed (optional)"

      - name: Run WER evaluation
        run: python -m pytest tests/evaluations/test_wer.py -v
        continue-on-error: true

      - name: Run Speaker Similarity evaluation
        run: python -m pytest tests/evaluations/test_speaker_similarity.py -v
        continue-on-error: true

  llm-judge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install numpy

      - name: Run LLM Judge (non-blocking)
        run: python -m pytest tests/evaluations/test_llm_judge.py -v
        continue-on-error: true

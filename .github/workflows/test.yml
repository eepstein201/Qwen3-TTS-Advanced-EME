name: Tests

on:
  push:
    branches: [ main, develop, fix/*, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        exclude:
          # Reduce matrix size for faster CI
          - os: macos-latest
            python-version: '3.10'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ffmpeg \
          libsndfile1 \
          portaudio19-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ffmpeg portaudio

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Verify installation
      run: |
        python -c "import gradio; print(f'✅ gradio {gradio.__version__} available')"
        python -c "import pytest; print(f'✅ pytest {pytest.__version__} available')"

    - name: Run Batch 1 tests (Core utilities)
      run: |
        python tests/run_batches.py --batch 1

    - name: Run Batch 2 tests (Voice & CLI)
      run: |
        python tests/run_batches.py --batch 2

    - name: Run Batch 3 tests (Server Infrastructure)
      run: |
        python tests/run_batches.py --batch 3

    - name: Run Batch 4 tests (Engine & UI)
      run: |
        python tests/run_batches.py --batch 4

    - name: Run Batch 5 tests (Optional)
      run: |
        python tests/run_batches.py --batch 5

    - name: Test cross-platform compatibility
      run: |
        python -c "
        import platform
        import sys

        print(f'Platform: {platform.system()}')
        print(f'Python: {sys.version}')
        print(f'Architecture: {platform.machine()}')

        # Test that all test dependencies are available
        import gradio
        import pytest
        import unittest

        print('✅ All test dependencies available')
        "

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: .pytest_cache/

  lint:
    # Static gates: lint, type-check, security (fast feedback)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Ruff (lint)
      run: ruff check qwen3_tts tests

    - name: Mypy (type check)
      run: mypy qwen3_tts/core qwen3_tts/server qwen3_tts/interface

    - name: Bandit (security, fail on HIGH)
      run: bandit -r qwen3_tts -c pyproject.toml --severity-level high

  coverage:
    # Coverage gate: 80% floor on the non-e2e suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ffmpeg \
          libsndfile1 \
          portaudio19-dev

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Pytest with coverage (non-e2e)
      run: |
        pytest -m "not e2e" --cov=qwen3_tts --cov-report=term-missing --cov-fail-under=80

  test-docker:
    # Container-based testing
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build test container
      run: |
        docker build -f Dockerfile.test -t qwen3-tts:test .

    - name: Run Batch 1 tests in container
      run: |
        docker run --rm qwen3-tts:test python tests/run_batches.py --batch 1

    - name: Run Batch 2 tests in container
      run: |
        docker run --rm qwen3-tts:test python tests/run_batches.py --batch 2

    - name: Verify container health
      run: |
        docker run --rm --health-cmd="python -c 'import qwen3_tts'" qwen3-tts:test

  test-minimal:
    # Minimal test job for quick feedback
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Quick smoke test
      run: |
        python -m unittest tests.test_voice_generation.TestReturnValueCounts -v

    - name: Test universal installation
      run: |
        pip install -e ".[test]"
        python -c "import gradio; print('✅ Universal test installation works')"

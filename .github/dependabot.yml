version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Range-scoped: patch/minor bumps still flow; only the known-conflicting
    # majors (and gradio's 6.15+ band, per pyproject's ~6.15 guidance) stop
    # raising PRs. Triage plan: docs/plans/2026-09-02-dependabot-triage.plan.md.
    ignore:
      - dependency-name: "gradio"
        versions: [">=6.15"]
      - dependency-name: "transformers"
        versions: [">=5"]
      - dependency-name: "vllm"
        versions: [">=0.9"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"

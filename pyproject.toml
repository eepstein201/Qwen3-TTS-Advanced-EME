[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen3-tts"
version = "3.0.0"
description = "Text-to-speech with voice cloning, built on Qwen3-TTS"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pySBD>=0.3.4",
    "num2words>=0.5.13",
    "requests>=2.28.0",
]

[project.optional-dependencies]
# PyTorch backend (Linux, Intel Mac, Colab/CUDA)
torch = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "qwen-tts",
    "transformers>=4.57.3",
]

# MLX backend (Apple Silicon only)
mlx = [
    "mlx>=0.30.3",
    "mlx-audio>=0.3.1",
    "mlx-lm>=0.30.5",
    "huggingface_hub",
]

# FastAPI server
server = [
    "fastapi>=0.110.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.29.0",
    "soundfile>=0.12.1",
    "psutil>=5.9",
]

# Gradio web UI
ui = [
    "gradio>=5.0.0",
]

# Audio processing extras
audio = [
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "pyrubberband",
    "pydub",
    "scipy",
]

# CUDA/Colab optimizations
cuda = [
    "accelerate",
    "bitsandbytes",
]

# Rich CLI progress bars
rich = [
    "rich>=13.7.1",
]

# Development tools
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-xdist>=3.0",      # parallel execution
    "pytest-timeout>=2.3",    # catch hanging tests
    "pytest-random-order>=1.1", # find interdependent tests
    "pytest-cov>=5.0",        # coverage reporting
]

# vLLM-Omni backend (Linux/CUDA only)
vllm = [
    "vllm>=0.8",
    "vllm-omni",
]

[project.scripts]
tts = "qwen3_tts.cli:cli"
test = "qwen3_tts.test_cli:test"
test-unit = "qwen3_tts.test_cli:test_unit"
test-integration = "qwen3_tts.test_cli:test_integration"
test-quick = "qwen3_tts.test_cli:test_quick"
test-parallel = "qwen3_tts.test_cli:test_parallel"
test-cov = "qwen3_tts.test_cli:test_cov"

[tool.hatch.build.targets.wheel]
packages = ["qwen3_tts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = "."
addopts = "-v --tb=short"
markers = [
    "unit: fast tests, no external services",
    "integration: requires FastAPI/server",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_server: needs a running server",
]
filterwarnings = [
    # All DeprecationWarnings from external dependencies (SWIG, transformers, etc.)
    # We cannot fix these - they are upstream issues
    "ignore::DeprecationWarning",
    # Gradio async cleanup (not our code)
    "ignore::ResourceWarning",
]

[tool.ruff]
exclude = ["colab_notebook.ipynb"]

[tool.coverage.run]
source = ["qwen3_tts"]
omit = ["qwen3_tts/test_cli.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

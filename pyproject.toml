[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen3-tts"
version = "3.0.0"
description = "Text-to-speech with voice cloning, built on Qwen3-TTS"
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.2",
    "pySBD>=0.3.4",
    "num2words>=0.5.13",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# PyTorch backend (Linux, Intel Mac, Colab/CUDA)
torch = [
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "qwen-tts",
    "transformers>=5.14.1",
]

# MLX backend (Apple Silicon only)
mlx = [
    "mlx>=0.32.0",
    "mlx-audio>=0.4.5",
    "mlx-lm>=0.30.5",
    "huggingface_hub",
]

# FastAPI server
server = [
    "fastapi>=0.139.2",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.0",
    "soundfile>=0.14.0",
    "psutil>=7.2.2",
]

# Gradio web UI
ui = [
    "gradio>=6.0.0,!=6.14.*,<7",  # 6.14.x recurses in the Dataframe frontend; 6.8.0 (torch env) and 6.20.0 (mlx env) verified clean. Do NOT raise the floor past ~6.15: gradio>=6.15 needs huggingface-hub>=1.2, which transformers<4.58 (torch env) forbids.
]

# Audio processing extras
audio = [
    "librosa>=0.11.0",
    "soundfile>=0.14.0",
    "pyrubberband",
    "pyloudnorm>=0.2.0",
    "pydub",
]

# CUDA/Colab optimizations
cuda = [
    "accelerate",
    "bitsandbytes",
]

# Rich CLI progress bars
rich = [
    "rich>=15.0.0",
]

# Development tools (for development workflow, not required for testing)
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.28.1",
    "pytest-xdist>=3.0",      # parallel execution
    "pytest-timeout>=2.4.0",    # catch hanging tests
    "pytest-random-order>=1.2.0", # find interdependent tests
    "pytest-cov>=7.1.0",        # coverage reporting
    "ruff>=0.16.0",              # linting + formatting
    "mypy>=2.3.0",             # static type checking
    "bandit>=1.7",            # security static analysis
]

# Universal test dependencies (works across all environments)
test = [
    "gradio>=6.0.0,!=6.14.*,<7",  # Required for UI tests; see the `ui` extra for why 6.14.x is excluded
    "pytest>=9.1.1",            # Core testing framework
    "pytest-asyncio>=0.23",   # Async test support
    "httpx>=0.28.1",            # HTTP client for testing
    "pytest-cov>=7.1.0",        # Coverage reporting
    "playwright>=1.61.0",     # E2E testing (if not already in main deps)
    "fastapi>=0.139.2",       # Server dependencies for integration tests
    "slowapi>=0.1.10",         # Rate limiting for server tests
    "uvicorn[standard]>=0.52.0",
    "soundfile>=0.14.0",
    "psutil>=7.2.2",
]

# AI voice-description enhancement (Design mode)
prompt-enhancer = [
    "anthropic>=0.25",
]

# vLLM-Omni backend (Linux/CUDA only)
vllm = [
    "vllm>=0.8",
    "vllm-omni",
]

[project.scripts]
tts = "qwen3_tts.cli:cli"
test = "qwen3_tts.test_cli:test"
test-unit = "qwen3_tts.test_cli:test_unit"
test-integration = "qwen3_tts.test_cli:test_integration"
test-quick = "qwen3_tts.test_cli:test_quick"
test-parallel = "qwen3_tts.test_cli:test_parallel"
test-cov = "qwen3_tts.test_cli:test_cov"

[tool.hatch.build.targets.wheel]
packages = ["qwen3_tts"]

[tool.ruff]
exclude = ["colab_notebook.ipynb"]

[tool.mypy]
python_version = "3.10"
# Heavy backends (torch/mlx/transformers/qwen_tts/mlx_audio) are lazily imported
# and not installed in every environment, so don't fail on their missing stubs.
ignore_missing_imports = true
warn_unused_ignores = true
# Excluded from type-checking for now:
#  - server/app.py: FastAPI route decorators + Starlette Request generics produce
#    framework-level type friction not worth annotating around without the FastAPI plugin.
#  - vllm_client.py / engine_vllm.py: optional vLLM-Omni backend with looser typing.
exclude = [
    "tests/",
    "build/",
    "colab_notebook.ipynb",
    "qwen3_tts/server/app.py",
    "qwen3_tts/server/vllm_client.py",
    "qwen3_tts/core/engine_vllm.py",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["qwen3_tts"]
omit = ["qwen3_tts/test_cli.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
